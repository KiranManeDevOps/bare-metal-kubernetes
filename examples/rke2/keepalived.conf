# =============================================================================
# keepalived — owns the API VIP 10.0.10.10.
#
# The VIP is tied to HAProxy's health: if HAProxy stops answering, this node's
# priority drops and the VIP moves. Keep this mechanism separate from the
# LoadBalancer address ranges — keepalived owns the API VIP, MetalLB and
# kube-vip own theirs, and the ranges must never overlap.
#
# virtual_router_id must be unique on the L2 segment. Two unrelated clusters
# sharing an ID will fight over each other's VIPs.
# =============================================================================
vrrp_script chk_haproxy {
    script "/bin/curl -f http://localhost:8404/stats || exit 1"
    interval 2
    weight -2
    fall 3
    rise 2
}

vrrp_instance VI_1 {
    state MASTER
    interface eth0                 # the NIC on 10.0.10.0/24
    virtual_router_id 61
    priority 110
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass <VRRP_PASSWORD>
    }
    virtual_ipaddress {
        10.0.10.10/24
    }
    track_script {
        chk_haproxy
    }
}
