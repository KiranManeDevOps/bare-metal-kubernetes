# =============================================================================
# HAProxy — TCP front end for the Kubernetes API.
#
# Listens on :6444 and forwards to the API server(s) on :6443. keepalived owns
# the VIP 10.0.10.10 and moves it if this health check fails, so kubeconfigs
# point at https://10.0.10.10:6444 and survive a control-plane node change.
#
# mode tcp — this is a TLS passthrough. Never terminate the API's TLS here.
# =============================================================================
global
    log stdout local0
    maxconn 4000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client 1m
    timeout server 1m
    retries 3

frontend k8s-api-frontend
    bind *:6444
    default_backend k8s-api-backend

backend k8s-api-backend
    option tcp-check
    balance roundrobin
    # Add further control-plane nodes here as they are introduced.
    server cp-01 10.0.10.11:6443 check fall 3 rise 2

# Stats endpoint — also used as keepalived's health check target.
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats auth admin:<STATS_PASSWORD>
